<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Gawaran Maternal Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="icon" href="/assets/logo.jpg" type="image/jpeg" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/assets/logo.jpg" alt="" class="brand-mini" width="64" height="64" />
      <h1>Set New Password</h1>
      <p id="resetSubtitle">Choose a strong password for your account</p>
    </div>

    <div id="formError" class="form-error" role="alert"></div>
    <div id="formSuccess" class="form-success" role="status"></div>
    <div id="loadingState" style="text-align:center;color:var(--gray-500);padding:1rem;">Verifying reset link...</div>

    <form id="resetPasswordForm" novalidate style="display:none;">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" />
        <div class="form-warning" id="passwordWarning">Password must be 8 to 72 characters and include a letter and number.</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
        <div class="form-warning" id="confirmPasswordWarning">Passwords do not match.</div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>

    <div class="form-footer">
      <a href="/login.html">← Back to Sign In</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script>initResetPasswordForm();</script>
</body>
</html>
