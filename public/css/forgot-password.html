<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Gawaran Maternal Clinic</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="icon" href="/assets/logo.jpg" type="image/jpeg" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/assets/logo.jpg" alt="" class="brand-mini" width="64" height="64" />
      <h1>Forgot Password</h1>
      <p>We'll email you a secure link to reset your password</p>
    </div>

    <div id="formError" class="form-error" role="alert"></div>
    <div id="formSuccess" class="form-success" role="status"></div>

    <form id="forgotPasswordForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
        <div class="form-warning" id="emailWarning">Please enter a valid email address.</div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
      </div>
    </form>

    <div class="form-footer">
      <a href="/login.html">← Back to Sign In</a>
    </div>
  </div>

  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script>initForgotPasswordForm();</script>
</body>
</html>
